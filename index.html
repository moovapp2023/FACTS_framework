<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View PDF Document</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- This embeds your PDF and fills the entire browser screen -->
    <iframe src="FACTS Framework.pdf">
        <p>Your browser does not support PDFs. <a href="your-file-name.pdf">Click here to download it.</a></p>
    </iframe>

</body>
</html>
